services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cet_reading
      POSTGRES_USER: cet_reading
      POSTGRES_PASSWORD: cet_reading
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - cet_reading_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cet_reading -d cet_reading"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://cet_reading:cet_reading@postgres:5432/cet_reading
      CORS_ORIGIN: http://localhost:4321,http://localhost:8081
      NODE_OPTIONS: --max-old-space-size=96
    ports:
      - "127.0.0.1:13000:3000"
    mem_limit: 160m
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/healthz').then((response) => {
          if (!response.ok) process.exit(1); }).catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://cet_reading:cet_reading@postgres:5432/cet_reading
      NODE_OPTIONS: --max-old-space-size=96
    mem_limit: 160m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  news:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["node", "apps/worker/dist/news-service.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://cet_reading:cet_reading@postgres:5432/cet_reading
      NODE_OPTIONS: --max-old-space-size=96
    mem_limit: 160m
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_API_BASE_URL: ""
    ports:
      - "127.0.0.1:8081:80"
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  cet_reading_data:
