services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cet_reading
      POSTGRES_USER: cet_reading
      POSTGRES_PASSWORD: cet_reading
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cet_reading_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cet_reading -d cet_reading"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://cet_reading:cet_reading@postgres:5432/cet_reading
      CORS_ORIGIN: http://localhost:4321,http://localhost:8080
      PROMPT_VERSION: cet-reading-v1
      AI_MODEL: unset
      AI_DRY_RUN: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://cet_reading:cet_reading@postgres:5432/cet_reading
      PROMPT_VERSION: cet-reading-v1
      AI_MODEL: unset
      AI_DRY_RUN: "true"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_API_BASE_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  cet_reading_data:
