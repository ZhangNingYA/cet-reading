name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cet-reading-${{ github.ref }}
  # Publishing a newer commit must never interrupt a production service switch.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: |
          npm run check
          npm run build
      - name: Verify approval migrations and workflows on PostgreSQL 16
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: 'postgres://postgres:postgres@127.0.0.1:5432/postgres' });
          await client.connect();
          try {
            for (const suite of ['schema', 'friends', 'account', 'media']) {
              await client.query('CREATE DATABASE approval_' + suite + '_test_ci');
            }
          } finally { await client.end(); }
          JS
          for suite in schema friends account media; do
            TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/approval_${suite}_test_ci" \
              node --import tsx "scripts/test-approval-${suite}.mjs"
          done
      - name: Validate Compose configuration and deployment scripts
        run: |
          cp .env.example .env
          docker compose config --quiet
          CET_API_IMAGE=ghcr.io/example/project/api@sha256:$(printf 'a%.0s' {1..64})
          CET_WORKER_IMAGE=ghcr.io/example/project/worker@sha256:$(printf 'b%.0s' {1..64})
          export CET_NEWS_IMAGE=$CET_WORKER_IMAGE
          CET_WEB_IMAGE=ghcr.io/example/project/web@sha256:$(printf 'c%.0s' {1..64})
          export CET_API_IMAGE CET_WORKER_IMAGE CET_WEB_IMAGE
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
          bash -n scripts/deploy-server.sh

  images:
    name: Build ${{ matrix.image }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, web]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set image reference
        id: reference
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_KIND: ${{ matrix.image }}
        run: |
          repository=${REPOSITORY,,}
          echo "image=ghcr.io/$repository/$IMAGE_KIND" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .npm-build-cache
          key: npm-build-${{ runner.os }}-${{ matrix.image }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-build-${{ runner.os }}-${{ matrix.image }}-
      - name: Inject npm cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@7a38cfab60c63ee1022b7c1a14a031c82f4114c7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: '{".npm-build-cache": "/root/.npm"}'
          skip-extraction: ${{ steps.npm-cache.outputs.cache-hit }}
      - name: Log in to image registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          # Identical cached images keep their digest, allowing unchanged services to stay up.
          provenance: false
          tags: ${{ steps.reference.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=cet-${{ matrix.image }}
          cache-to: type=gha,scope=cet-${{ matrix.image }},mode=max
      - name: Smoke test production image
        env:
          IMAGE: ${{ steps.reference.outputs.image }}@${{ steps.build.outputs.digest }}
          IMAGE_KIND: ${{ matrix.image }}
        run: |
          docker pull "$IMAGE"
          bash scripts/smoke-image.sh
      - name: Record immutable image reference and size
        env:
          IMAGE: ${{ steps.reference.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_KIND: ${{ matrix.image }}
        run: |
          mkdir -p release-images
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "release-images/$IMAGE_KIND.image"
          docker image inspect --format '{{.Size}}' "$IMAGE@$DIGEST" | awk -v name="$IMAGE_KIND" '{printf "%s image: %.1f MiB\n", name, $1/1048576}' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release image reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.image }}
          path: release-images/*.image
          retention-days: 30

  deploy:
    name: Deploy to Azure server
    needs: images
    runs-on: [self-hosted, cet-reading]
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up release planner
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Download tested image references
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: ${{ runner.temp }}/cet-release-images
          merge-multiple: true
      - name: Prepare exact release and update plan
        env:
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/deploy-server.sh /home/cyan/cet-reading prepare "$GITHUB_SHA" "$RUNNER_TEMP/cet-release-images" "ghcr.io/${REPOSITORY,,}"
      - name: Pull API, Worker and Web images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/deploy-server.sh /home/cyan/cet-reading pull "$GITHUB_SHA"
      - name: Apply required migrations and update changed services
        run: bash scripts/deploy-server.sh /home/cyan/cet-reading apply "$GITHUB_SHA"
      - name: Verify local services and record release
        run: bash scripts/deploy-server.sh /home/cyan/cet-reading verify "$GITHUB_SHA"
      - name: Restore previous application images on failure
        if: failure()
        run: bash scripts/deploy-server.sh /home/cyan/cet-reading rollback "$GITHUB_SHA"

  verify:
    name: Verify public deployment
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Prepare deployment checks
        run: |
          npm ci --no-audit --no-fund
          npm run build:contracts
      - name: Check the public site and API
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://cet.fulafu.com' }}
        run: npm run verify:deployment
